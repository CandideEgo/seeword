events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Access log WITHOUT query strings: media URLs carry JWTs (?token= for
    # shadowing audio), which must never be written to disk logs.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

    server_tokens off;

    # Video/audio access depends on publication and the current viewer. Recheck every request.
    map $uri $uncacheable_media {
        default 1;
        ~*\.(jpg|jpeg|png|gif|webp)$ 0;
        ~^/media/proxy$ 0;
    }

    # Proxy cache path — MUST be declared before any proxy_cache usage
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=24h max_size=100m;

    # Logging
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Rate limit zones
    # Same as nginx.conf: only `login` is applied; `api` is declared but unused
    # (per-route limits live in app/core/limiter.py); `upload` was removed with
    # the user-upload feature (INV-003).
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # Upstream servers
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # SSL certificates
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Modern SSL settings — TLS 1.2+ only, strong ciphers
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # SSL session caching
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP stapling (enable when cert supports it)
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # HSTS — force HTTPS for 1 year, include subdomains
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Security headers — the browser-facing HTML is proxied through nginx
        # (the backend middleware only covers /api responses). Locations that
        # set their own add_header must re-list these (see /media/ below).
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # script-src 'unsafe-inline' is required: Next.js App Router emits inline
        # hydration/bootstrap scripts in prod builds, and layout.tsx ships a static
        # theme-init inline script (FOUC prevention). Removing it needs per-request
        # nonce wiring — deferred, not an oversight.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob: https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' wss://$http_host https://www.youtube.com; object-src 'none'; base-uri 'self'" always;

        client_max_body_size 500m;

        # API proxy
        # Inherits server security headers; do not introduce local add_header directives.
        location ~ ^/api/v1/(teaching/runs/[^/]+/events|mcp/)$ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 75s;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (needed for /api/v1/notifications/ws)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # Rate limiting for the real auth entry points (app/api/v1/auth.py).
        # The old nested locations targeted /api/v1/auth/login and
        # /api/v1/auth/register — paths that do not exist, so login/register
        # had no edge limit at all. Exact matches (top level) beat /api/.
        location = /api/v1/auth/sms/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/phone-login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/sms/register {
            limit_req zone=login burst=2 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/sms/reset-password {
            limit_req zone=login burst=2 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/sms/send-code {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Media files with caching
        location /media/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            # XFF/X-Real-IP must be overwritten with the real client address:
            # /media was previously passing the client-supplied X-Forwarded-For
            # through untouched, letting users spoof the rate-limit key.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_cache STATIC;
            proxy_cache_key "public-media-v2:$scheme$proxy_host$request_uri";
            proxy_cache_bypass $uncacheable_media $http_authorization $arg_token $cookie_seeword_token $cookie_seeword_admin_token;
            proxy_no_cache $uncacheable_media $http_authorization $arg_token $cookie_seeword_token $cookie_seeword_admin_token;
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status always;
            # add_header does not inherit once a location sets its own —
            # re-list the server-level security headers here.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            # Keep this identical to the server policy: local audio playback needs blob:.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self' blob: https:; frame-src https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' wss://$http_host https://www.youtube.com; object-src 'none'; base-uri 'self'" always;
        }

        # Private per-user shadowing recordings — never cache (URLs carry a
        # per-user ?token= so shared cache keys would multiply and risk
        # serving one user's audio to another via cache poisoning).
        location /media/shadowing/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # Health check
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
