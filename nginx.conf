# HTTP-only nginx config for initial setup / development.
# For production with SSL, use nginx.ssl.conf instead.
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Access log WITHOUT query strings: media URLs carry JWTs (?token= for
    # shadowing audio), which must never be written to disk logs.
    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

    server_tokens off;

    # Video/audio access depends on publication and the current viewer. Recheck every request.
    map $uri $uncacheable_media {
        default 1;
        ~*\.(jpg|jpeg|png|gif|webp)$ 0;
        ~^/media/proxy$ 0;
    }

    # Proxy cache path — MUST be declared before any proxy_cache usage
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=24h max_size=100m;

    # Logging
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Rate limit zones
    # `login` is used by the six auth locations below. `api` is declared but no
    # location applies `limit_req zone=api`, so /api/ has no edge rate limit —
    # per-route limits live in the app (app/core/limiter.py). The `upload` zone
    # was removed with the user-upload feature (INV-003).
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # Upstream servers
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # ---- HTTP-only server (use before SSL is configured) ----
    # When SSL certificates are ready, replace this file with nginx.ssl.conf
    server {
        listen 80;
        server_name _;

        client_max_body_size 500m;

        # API proxy
        # Teaching events and MCP use ordinary HTTP streaming, without WebSocket upgrade.
        location ~ ^/api/v1/(teaching/runs/[^/]+/events|mcp/)$ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 75s;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (needed for /api/v1/notifications/ws)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        # Rate limiting for the real auth entry points (app/api/v1/auth.py).
        # This used to be a nested location for /api/v1/auth/login and
        # /api/v1/auth/register — paths that do not exist, so login/register
        # had no edge limit at all. Exact matches (top level) beat /api/.
        location = /api/v1/auth/sms/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/phone-login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/sms/register {
            limit_req zone=login burst=2 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/sms/reset-password {
            limit_req zone=login burst=2 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/v1/auth/sms/send-code {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Media files with caching
        location /media/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            # Overwrite XFF/X-Real-IP with the real client address — passing
            # the client-supplied X-Forwarded-For through would let users
            # spoof the rate-limit key.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_cache STATIC;
            proxy_cache_key "public-media-v2:$scheme$proxy_host$request_uri";
            proxy_cache_bypass $uncacheable_media $http_authorization $arg_token $cookie_seeword_token $cookie_seeword_admin_token;
            proxy_no_cache $uncacheable_media $http_authorization $arg_token $cookie_seeword_token $cookie_seeword_admin_token;
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1m;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Private per-user shadowing recordings — never cache (URLs carry a
        # per-user ?token= so shared cache keys would multiply and risk
        # serving one user's audio to another via cache poisoning).
        location /media/shadowing/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # Health check
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
