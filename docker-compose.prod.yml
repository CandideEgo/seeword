# Production.
# Secrets come from the shell environment or a .env file.
#
#   docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    # A07：持久化契约的唯一正文是 deploy/redis/redis.conf（AOF everysec、RDB 关闭、
    # noeviction）。没有它时 compose 一重建容器，队列与撤销状态就一起没了。
    # A10：ACL 身份（default/cloud/gpu）来自宿主上渲染好的文件；密码不进 git。
    # 渲染：REDIS_PASSWORD=... REDIS_GPU_PASSWORD=... \
    #         python3 scripts/isolation/render_redis_acl.py --out deploy/redis/users.acl
    # 文件须 600 且属主为容器内 redis 用户（999:1000），否则 Redis 拒绝启动。
    command: redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
    restart: unless-stopped
    volumes:
      - redis-data:/data
      - ./deploy/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - ./deploy/redis/users.acl:/usr/local/etc/redis/users.acl:ro
    # Publish to the host loopback only so a remote GPU worker can reach the
    # broker over an SSH tunnel / WireGuard without exposing Redis to the
    # public internet. GPU worker REDIS_URL: redis://:<pw>@127.0.0.1:6379/0
    # (via `ssh -L 6379:127.0.0.1:6379 ...` from the GPU machine).
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "cloud", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.cloud
    # The image ENTRYPOINT runs `alembic upgrade head` first, then execs the
    # command below. Keep the entrypoint so migrations run on every start.
    #
    # 访问日志：**故意不开** `--access-logfile`。理由（已按源码核实，不是猜的）：
    #   - 这里的 worker 是 uvicorn.workers.UvicornWorker，**访问日志行是 uvicorn 打的，
    #     不是 gunicorn**。uvicorn 的行格式是
    #     '%s - "%s %s HTTP/%s" %d'，其中路径取 get_path_with_query_string(scope)
    #     —— **带 query string**（uvicorn/protocols/utils.py:53）。
    #   - frontend 的 mediaUrl() 把用户 access token 拼成 `?token=<JWT>`
    #     （<video>/<audio> 发不了请求头），所以每次跟读播放都会把**可冒充用户的凭证**
    #     写进容器 stdout → docker json-file → 日志轮转/外发/备份长期留存
    #     （token 有效期 30 分钟，日志留存期远长于此）。
    #   - gunicorn 的 `--access-logformat`（含 `%(U)s` 这种只取 path 的写法）在这里
    #     **是空操作**：gunicorn 的 atom 替换只发生在它自己的 WSGI 请求路径
    #     （gunicorn/glogging.py:345 `Logger.access()`），而 uvicorn worker 直接跑 ASGI
    #     循环，压根不经过那条路径。加 `--access-logformat` 只会得到「以为改了、其实
    #     没改」的假安全感。
    #   - 去掉 `--access-logfile` 之后，gunicorn 不再给 `uvicorn.access` 挂 handler，
    #     而 uvicorn worker 又把该 logger 的 propagate 关掉 → uvicorn 的访问日志
    #     彻底不输出（已实测：带 --access-logfile 时日志行里有
    #     `GET /media/video/1.mp4?token=eyJ...`，去掉后没有任何访问日志行）。
    # - 请求轨迹并没有丢，两处都还在且都不含 query：
    #   - nginx（nginx.conf / nginx.ssl.conf）的 log_format 用 `$uri`，不含 query；
    #   - 应用自己的请求日志中间件（backend/app/main.py）记 method / path / status /
    #     request_id，path 取 `request.url.path`（无 query），生产是 JSON 结构化输出。
    # - 想恢复一份「后端自己的访问日志」时，正确做法是加一个剥掉 query 的日志
    #   filter（uvicorn.access 的 message 里第三个参数就是带 query 的路径），
    #   而不是靠 gunicorn 的 --access-logformat —— 见 backend/app/core/logging.py。
    command: >
      gunicorn app.main:app
        -w 2
        -k uvicorn.workers.UvicornWorker
        -b 0.0.0.0:8000
        --error-logfile -
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://cloud:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # LLM provider: Command Code gateway + per-task model routing
      # (catalog/free-model facts live in backend/app/services/llm_provider.py).
      COMMANDCODE_API_KEY: ${COMMANDCODE_API_KEY:-}
      COMMANDCODE_BASE_URL: ${COMMANDCODE_BASE_URL:-https://api.commandcode.ai/provider/v1}
      COMMANDCODE_MODEL: ${COMMANDCODE_MODEL:-minimax/minimax-m3.1-flash:free}
      COMMANDCODE_ZDR: ${COMMANDCODE_ZDR:-false}
      LLM_CALL_TIMEOUT: ${LLM_CALL_TIMEOUT:-90}
      TEACHING_ENABLED: ${TEACHING_ENABLED:-false}
      TEACHING_RUNS_ENABLED: ${TEACHING_RUNS_ENABLED:-false}
      TEACHING_ALLOWED_USER_IDS: ${TEACHING_ALLOWED_USER_IDS:-}
      MCP_READ_ENABLED: ${MCP_READ_ENABLED:-false}
      MCP_WRITE_ENABLED: ${MCP_WRITE_ENABLED:-false}
      MCP_SDK_ENABLED: ${MCP_SDK_ENABLED:-false}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-http://llm-gateway-adapter:4000}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-${LITELLM_MASTER_KEY:-}}
      LLM_GATEWAY_ADMIN_KEY: ${LLM_GATEWAY_ADMIN_KEY:-${LITELLM_MASTER_KEY:-}}
      LLM_GATEWAY_V2_TEAM_ID: ${LLM_GATEWAY_V2_TEAM_ID:-}
      LLM_GATEWAY_GOVERNANCE_VERIFIED: ${LLM_GATEWAY_GOVERNANCE_VERIFIED:-false}
      # V2 teaching: dialogue/streaming are separate default-off capabilities.
      # Every name here must be listed, or setting it in .env silently does nothing.
      TEACHING_DIALOGUE_ENABLED: ${TEACHING_DIALOGUE_ENABLED:-false}
      TEACHING_STREAMING_ENABLED: ${TEACHING_STREAMING_ENABLED:-false}
      LLM_GATEWAY_MODEL: ${LLM_GATEWAY_MODEL:-teaching}
      LLM_GATEWAY_TUTOR_MODEL: ${LLM_GATEWAY_TUTOR_MODEL:-teaching-tutor}
      LLM_GATEWAY_TUTOR_MAX_TOKENS: ${LLM_GATEWAY_TUTOR_MAX_TOKENS:-1024}
      CONTENT_RECEIPTS_ENABLED: ${CONTENT_RECEIPTS_ENABLED:-false}
      CONTENT_RECEIPT_PUBLIC_KEYS: ${CONTENT_RECEIPT_PUBLIC_KEYS:-{}}
      CONTENT_RECEIPT_ISSUER: ${CONTENT_RECEIPT_ISSUER:-seeword-content-gateway}
      CONTENT_RECEIPT_MAX_AGE_SECONDS: ${CONTENT_RECEIPT_MAX_AGE_SECONDS:-86400}
      CONTENT_VERIFICATION_API_KEY: ${CONTENT_VERIFICATION_API_KEY:-}
      LLM_MODEL_TRANSLATION: ${LLM_MODEL_TRANSLATION:-}
      LLM_MODEL_WORD_NOTES: ${LLM_MODEL_WORD_NOTES:-}
      LLM_MODEL_CLASSIFICATION: ${LLM_MODEL_CLASSIFICATION:-}
      LLM_MODEL_EDITORIAL: ${LLM_MODEL_EDITORIAL:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-}
      OSS_UPLOAD_ENABLED: ${OSS_UPLOAD_ENABLED:-false}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN:-}
      OSS_PREFIX: ${OSS_PREFIX:-}
      # Remote-GPU transcription callback (inbound) auth + watchdog timeout.
      TRANSCRIPTION_CALLBACK_SECRET: ${TRANSCRIPTION_CALLBACK_SECRET:-}
      VIDEO_TRANSCRIBE_TIMEOUT: ${VIDEO_TRANSCRIBE_TIMEOUT:-7200}
      # Translation engine: agnes 继承 OPENAI_*（可指向 deepseek 等 OpenAI-compatible 端点）
      TRANSLATION_ENGINE: ${TRANSLATION_ENGINE:-agnes}
      TRANSLATION_FALLBACK_ENGINE: ${TRANSLATION_FALLBACK_ENGINE:-}
      TRANSLATION_CONCURRENT: ${TRANSLATION_CONCURRENT:-false}
      ENV: ${ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # SMS 验证码（生产必须配置，否则短信流程 fail-closed；见 sms_service._dev_fake_enabled）
      SMS_LOGIN_ENABLED: ${SMS_LOGIN_ENABLED:-false}
      ALIYUN_SMS_ACCESS_KEY: ${ALIYUN_SMS_ACCESS_KEY:-}
      ALIYUN_SMS_SECRET_KEY: ${ALIYUN_SMS_SECRET_KEY:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_REGISTER: ${ALIYUN_SMS_TEMPLATE_REGISTER:-}
      ALIYUN_SMS_TEMPLATE_CHANGE_PHONE: ${ALIYUN_SMS_TEMPLATE_CHANGE_PHONE:-}
      ALIYUN_SMS_TEMPLATE_RESET_PASSWORD: ${ALIYUN_SMS_TEMPLATE_RESET_PASSWORD:-}
      # 金数据（站外收款页）→ 自动开通 Pro。配置项见
      # backend/app/core/config.py::Settings（jinshuju_* 那一组）。
      # 本文件此前一个 JINSHUJU_* 都没传，而 prod compose 的 environment 是白名单式
      # （没有 env_file）——生产环境这组变量全部取不到默认值，支付链路根本没法启用。
      # 值一律从宿主环境 / .env 透传，真值不写进本文件（变量名见 backend/.env.example）。
      JINSHUJU_ENABLED: ${JINSHUJU_ENABLED:-false}
      JINSHUJU_ACCESS_TOKEN: ${JINSHUJU_ACCESS_TOKEN:-}
      JINSHUJU_FORM_TOKEN: ${JINSHUJU_FORM_TOKEN:-}
      JINSHUJU_WEBHOOK_SECRET: ${JINSHUJU_WEBHOOK_SECRET:-}
      JINSHUJU_TIER_FIELD: ${JINSHUJU_TIER_FIELD:-field_2}
      JINSHUJU_PHONE_FIELD: ${JINSHUJU_PHONE_FIELD:-field_5}
      JINSHUJU_SYNC_LOOKBACK_HOURS: ${JINSHUJU_SYNC_LOOKBACK_HOURS:-72}
      JINSHUJU_PURCHASE_URL: ${JINSHUJU_PURCHASE_URL:-}
      JINSHUJU_PURCHASE_TOKEN_TTL_MINUTES: ${JINSHUJU_PURCHASE_TOKEN_TTL_MINUTES:-1440}
      # 站内购买 token（写在 x_field_1 的 HMAC 签名）用的密钥。
      # 是否必填由后端按 JINSHUJU_ENABLED 决定（app/core/config.py）：
      # 开启金数据时必须显式配置且 ≠ JWT_SECRET，关闭时留空即可。这里用
      # `${VAR:-}`（可选）而不是 `${VAR:?}`，否则「没开金数据」的部署会在
      # compose 阶段被一个根本用不到的密钥卡住，运维通常只会填个假值绕过，
      # 反而破坏密钥分离的本意。
      # 生成：openssl rand -hex 32（必须与 JWT_SECRET 不同）。
      JINSHUJU_PURCHASE_TOKEN_SECRET: ${JINSHUJU_PURCHASE_TOKEN_SECRET:-}
      # Trust X-Forwarded-For from the nginx container so per-IP rate
      # limiting (app.core.limiter) sees real client IPs instead of the
      # nginx container IP for every request. Safe: backend is only
      # exposed on the internal compose network behind nginx, and nginx
      # OVERWRITES X-Forwarded-For with $remote_addr (see nginx.conf) so
      # clients cannot spoof the header.
      FORWARDED_ALLOW_IPS: "*"
      # A09/OPS-05：站外告警与 Sentry。本文件 environment 是白名单且没有 env_file
      # （backend/.dockerignore 也排除 .env*），所以宿主 .env 里写了这些值，不在这里
      # 透传就进不了容器。空值 = 未配置（webhook 回落到站内管理员通知）。
      SENTRY_DSN: ${SENTRY_DSN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      # 健康监控在 web 进程里跑（worker/beat 只写心跳键）；阈值按机器容量调整。
      HEALTH_MONITOR_ENABLED: ${HEALTH_MONITOR_ENABLED:-true}
      HEALTH_MONITOR_INTERVAL_SECONDS: ${HEALTH_MONITOR_INTERVAL_SECONDS:-60}
      HEALTH_WORKER_STALE_SECONDS: ${HEALTH_WORKER_STALE_SECONDS:-300}
      HEALTH_BEAT_STALE_SECONDS: ${HEALTH_BEAT_STALE_SECONDS:-300}
      HEALTH_QUEUE_BACKLOG_THRESHOLD: ${HEALTH_QUEUE_BACKLOG_THRESHOLD:-200}
      HEALTH_DISK_PERCENT_THRESHOLD: ${HEALTH_DISK_PERCENT_THRESHOLD:-85}
      HEALTH_PIPELINE_FAILURE_THRESHOLD: ${HEALTH_PIPELINE_FAILURE_THRESHOLD:-5}
      HEALTH_PIPELINE_FAILURE_WINDOW_MINUTES: ${HEALTH_PIPELINE_FAILURE_WINDOW_MINUTES:-60}
      HEALTH_ALERT_THROTTLE_SECONDS: ${HEALTH_ALERT_THROTTLE_SECONDS:-1800}
    expose:
      - "8000"
    volumes:
      - media:/app/media
      # Runtime reference data (ECDICT dictionary + exam paper bank). Excluded
      # from the image by backend/.dockerignore, so bind-mount read-only.
      - ./backend/data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 2g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.cloud
    # Cloud worker consumes only the default queue; the transcription_gpu queue
    # is drained by the remote GPU worker (not this service).
    command: celery -A app.tasks.celery_app worker -Q celery --loglevel=warning
    # Migrations belong to the backend service alone (see backend/entrypoint.sh).
    # This worker only consumes the schema, and it starts only once backend is
    # healthy — i.e. once migrations have been applied.
    environment:
      RUN_MIGRATIONS: "0"
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://cloud:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # LLM provider: Command Code gateway + per-task model routing
      # (catalog/free-model facts live in backend/app/services/llm_provider.py).
      COMMANDCODE_API_KEY: ${COMMANDCODE_API_KEY:-}
      COMMANDCODE_BASE_URL: ${COMMANDCODE_BASE_URL:-https://api.commandcode.ai/provider/v1}
      COMMANDCODE_MODEL: ${COMMANDCODE_MODEL:-minimax/minimax-m3.1-flash:free}
      COMMANDCODE_ZDR: ${COMMANDCODE_ZDR:-false}
      LLM_CALL_TIMEOUT: ${LLM_CALL_TIMEOUT:-90}
      LLM_MODEL_TRANSLATION: ${LLM_MODEL_TRANSLATION:-}
      LLM_MODEL_WORD_NOTES: ${LLM_MODEL_WORD_NOTES:-}
      LLM_MODEL_CLASSIFICATION: ${LLM_MODEL_CLASSIFICATION:-}
      LLM_MODEL_EDITORIAL: ${LLM_MODEL_EDITORIAL:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-}
      OSS_SECRET_KEY: ${OSS_SECRET_KEY:-}
      OSS_UPLOAD_ENABLED: ${OSS_UPLOAD_ENABLED:-false}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN:-}
      OSS_PREFIX: ${OSS_PREFIX:-}
      TRANSCRIPTION_CALLBACK_SECRET: ${TRANSCRIPTION_CALLBACK_SECRET:-}
      VIDEO_TRANSCRIBE_TIMEOUT: ${VIDEO_TRANSCRIBE_TIMEOUT:-7200}
      TRANSLATION_ENGINE: ${TRANSLATION_ENGINE:-agnes}
      TRANSLATION_FALLBACK_ENGINE: ${TRANSLATION_FALLBACK_ENGINE:-}
      TRANSLATION_CONCURRENT: ${TRANSLATION_CONCURRENT:-false}
      ENV: ${ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # 金数据同步在这个 worker 里跑（beat 每 5 分钟排一次 sync_jinshuju_payments，
      # webhook 触发的 process_jinshuju_entry 也落在这个队列），所以 worker 至少要有
      # 「能不能同步」和「怎么认表单项」这一组；purchase_url / purchase token secret
      # 只服务站内的购买链接（API 用），不放进 worker —— 少一份密钥多一份密钥副本。
      # celery-beat 不需要这组变量：它只按任务名排程，任务体在 worker 里执行。
      JINSHUJU_ENABLED: ${JINSHUJU_ENABLED:-false}
      JINSHUJU_ACCESS_TOKEN: ${JINSHUJU_ACCESS_TOKEN:-}
      JINSHUJU_FORM_TOKEN: ${JINSHUJU_FORM_TOKEN:-}
      JINSHUJU_TIER_FIELD: ${JINSHUJU_TIER_FIELD:-field_2}
      JINSHUJU_PHONE_FIELD: ${JINSHUJU_PHONE_FIELD:-field_5}
      JINSHUJU_SYNC_LOOKBACK_HOURS: ${JINSHUJU_SYNC_LOOKBACK_HOURS:-72}
      # A09/OPS-05：worker 的异常要进 Sentry，管线派发积压告警要走站外 webhook
      # （此前 compose 没透传，send_alert 只能回落到站内通知，DB 挂了就一起没了）。
      SENTRY_DSN: ${SENTRY_DSN:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
    volumes:
      - media:/app/media
      - ./backend/data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # RUN_MIGRATIONS=0 above means this worker does not migrate; it must not
      # start serving tasks against a schema backend has not migrated yet.
      backend:
        condition: service_healthy
    # Whisper-adjacent workers can spike; cap to protect the host.
    mem_limit: 4g
    # Worker runs no HTTP server, so the image HEALTHCHECK (curl :8000/health)
    # would always fail and wrongly mark it unhealthy. Disable the inherited probe.
    healthcheck:
      disable: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  teaching:
    profiles: [teaching]
    build:
      context: ./backend
      dockerfile: Dockerfile.cloud
    command: celery -A app.tasks.celery_app worker -Q teaching --concurrency=2 --loglevel=warning
    environment:
      RUN_MIGRATIONS: "0"
      ENV: production
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://cloud:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      TRANSCRIPTION_CALLBACK_SECRET: ${TRANSCRIPTION_CALLBACK_SECRET:-}
      TEACHING_ENABLED: ${TEACHING_ENABLED:-false}
      TEACHING_RUNS_ENABLED: ${TEACHING_RUNS_ENABLED:-false}
      TEACHING_ALLOWED_USER_IDS: ${TEACHING_ALLOWED_USER_IDS:-}
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-http://llm-gateway-adapter:4000}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-${LITELLM_MASTER_KEY:-}}
      LLM_GATEWAY_ADMIN_KEY: ${LLM_GATEWAY_ADMIN_KEY:-${LITELLM_MASTER_KEY:-}}
      LLM_GATEWAY_V2_TEAM_ID: ${LLM_GATEWAY_V2_TEAM_ID:-}
      LLM_GATEWAY_GOVERNANCE_VERIFIED: ${LLM_GATEWAY_GOVERNANCE_VERIFIED:-false}
      # V2 teaching: dialogue/streaming are separate default-off capabilities.
      # Every name here must be listed, or setting it in .env silently does nothing.
      TEACHING_DIALOGUE_ENABLED: ${TEACHING_DIALOGUE_ENABLED:-false}
      TEACHING_STREAMING_ENABLED: ${TEACHING_STREAMING_ENABLED:-false}
      LLM_GATEWAY_MODEL: ${LLM_GATEWAY_MODEL:-teaching}
      LLM_GATEWAY_TUTOR_MODEL: ${LLM_GATEWAY_TUTOR_MODEL:-teaching-tutor}
      LLM_GATEWAY_TUTOR_MAX_TOKENS: ${LLM_GATEWAY_TUTOR_MAX_TOKENS:-1024}
      CONTENT_RECEIPTS_ENABLED: ${CONTENT_RECEIPTS_ENABLED:-false}
      CONTENT_RECEIPT_PUBLIC_KEYS: ${CONTENT_RECEIPT_PUBLIC_KEYS:-{}}
      CONTENT_RECEIPT_ISSUER: ${CONTENT_RECEIPT_ISSUER:-seeword-content-gateway}
      CONTENT_RECEIPT_MAX_AGE_SECONDS: ${CONTENT_RECEIPT_MAX_AGE_SECONDS:-86400}
      CONTENT_VERIFICATION_API_KEY: ${CONTENT_VERIFICATION_API_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- V2 model gateway (opt-in profile `llm-gateway`) ----------------------
  # The gateway is internal-only; the adapter is the caller-facing entry and
  # LiteLLM remains the single usage/cost ledger. Provider keys live here and
  # in the backend only until E3d removes the backend copies.
  llm-gateway-db-init:
    profiles: [llm-gateway]
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    command:
      - sh
      - -c
      - >-
        until pg_isready -h db -U ${DB_USER}; do sleep 1; done;
        psql -h db -U ${DB_USER} -d ${DB_NAME} -c 'CREATE SCHEMA IF NOT EXISTS litellm;'
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  llm-gateway:
    profiles: [llm-gateway]
    image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    entrypoint: ["/bin/sh", "/spike/entrypoint-gateway.sh"]
    environment:
      COMMANDCODE_API_KEY: ${COMMANDCODE_API_KEY:?COMMANDCODE_API_KEY is required for the gateway}
      COMMANDCODE_MODEL: ${COMMANDCODE_MODEL:-minimax/minimax-m3.1-flash:free}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required for the gateway}
      LITELLM_DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=litellm
      REDIS_GATEWAY_PASSWORD: ${REDIS_GATEWAY_PASSWORD:?REDIS_GATEWAY_PASSWORD is required for the gateway}
      GATEWAY_REDIS_HOST: redis
      GATEWAY_REDIS_PORT: "6379"
      GATEWAY_REDIS_DB: "2"
      V2_INPUT_COST_PER_TOKEN: ${V2_INPUT_COST_PER_TOKEN:-0}
      V2_OUTPUT_COST_PER_TOKEN: ${V2_OUTPUT_COST_PER_TOKEN:-0}
      V2_MAX_INPUT_TOKENS: ${V2_MAX_INPUT_TOKENS:-4096}
      V2_MAX_OUTPUT_TOKENS: ${V2_MAX_OUTPUT_TOKENS:-128}
      TZ: UTC
    volumes:
      - ./deploy/v2-gateway/config.prod.template.yaml:/spike/config.prod.template.yaml:ro
      - ./deploy/v2-gateway/render_config.py:/spike/render_config.py:ro
      - ./deploy/v2-gateway/entrypoint-gateway.sh:/spike/entrypoint-gateway.sh:ro
    ports:
      # Admin/dashboard only on host loopback; use an SSH tunnel from the operator.
      - "127.0.0.1:4001:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-gateway-db-init:
        condition: service_completed_successfully
      llm-gateway-shim:
        condition: service_started
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  llm-gateway-shim:
    profiles: [llm-gateway]
    image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    entrypoint: ["python", "-m", "uvicorn", "app:shim_app", "--host", "0.0.0.0", "--port", "4100"]
    working_dir: /adapter
    environment:
      # Must include the provider's /v1 suffix.
      UPSTREAM_BASE_URL: ${COMMANDCODE_BASE_URL:-https://api.commandcode.ai/provider/v1}
      MODEL_MAX_OUTPUT_TOKENS: ${V2_MAX_OUTPUT_TOKENS:-128}
      ADAPTER_MODEL_OUTPUT_CAPS: ${ADAPTER_MODEL_OUTPUT_CAPS:-{}}
      ADAPTER_TIMEOUT_SECONDS: "30"
    volumes:
      - ./deploy/v2-gateway/adapter:/adapter:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  llm-gateway-adapter:
    profiles: [llm-gateway]
    image: ghcr.io/berriai/litellm:v1.106.6@sha256:37e2dafb088a7723beb998590682957386dfc83ffea1848486f8e0e5cfac0b06
    entrypoint: ["python", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "4000"]
    working_dir: /adapter
    environment:
      LITELLM_BASE_URL: http://llm-gateway:4000
      MODEL_MAX_OUTPUT_TOKENS: ${V2_MAX_OUTPUT_TOKENS:-128}
      ADAPTER_MODEL_OUTPUT_CAPS: ${ADAPTER_MODEL_OUTPUT_CAPS:-{}}
      ADAPTER_TIMEOUT_SECONDS: "30"
    volumes:
      - ./deploy/v2-gateway/adapter:/adapter:ro
    depends_on:
      - llm-gateway
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.cloud
    # Periodic tasks: order-expiry + stale-transcription watchdog.
    command: celery -A app.tasks.celery_app beat --loglevel=warning
    # Migrations belong to the backend service alone (see backend/entrypoint.sh).
    environment:
      RUN_MIGRATIONS: "0"
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      REDIS_URL: redis://cloud:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Beat does not call the LLM, but Settings' production guard requires an
      # LLM key at import time; pass the same provider key as the worker.
      COMMANDCODE_API_KEY: ${COMMANDCODE_API_KEY:-}
      TRANSCRIPTION_CALLBACK_SECRET: ${TRANSCRIPTION_CALLBACK_SECRET:-}
      VIDEO_TRANSCRIBE_TIMEOUT: ${VIDEO_TRANSCRIBE_TIMEOUT:-7200}
      TRANSLATION_ENGINE: ${TRANSLATION_ENGINE:-agnes}
      TRANSLATION_FALLBACK_ENGINE: ${TRANSLATION_FALLBACK_ENGINE:-}
      TRANSLATION_CONCURRENT: ${TRANSLATION_CONCURRENT:-false}
      ENV: ${ENV:-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # A09/OPS-05：beat 只排程，不发告警；Sentry 用来看到 scheduler 自身的异常。
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      redis:
        condition: service_healthy
      # RUN_MIGRATIONS=0 above means beat does not migrate; it must not schedule
      # against a schema backend has not migrated yet.
      backend:
        condition: service_healthy
    mem_limit: 512m
    # Beat scheduler runs no HTTP server; disable the inherited image healthcheck.
    healthcheck:
      disable: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  flower:
    image: mher/flower:2.0
    # Opt-in monitoring UI. Kept out of the default `up -d`: this host
    # (2C/1.6GB) has no memory headroom to spare, and a dashboard is not worth
    # 40MB of it by default. Start it explicitly when you need it:
    #   docker compose -f docker-compose.prod.yml --profile monitoring up -d flower
    profiles: ["monitoring"]
    command: celery --broker=redis://:${REDIS_PASSWORD}@redis:6379/0 flower --port=5555 --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-flower}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Production default: TLS + security headers (nginx.ssl.conf). Override
      # for a certificate-less bootstrap with: NGINX_CONF=nginx.conf
      - ./${NGINX_CONF:-nginx.ssl.conf}:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://seeword.top}
        NEXT_PUBLIC_COMPANY_NAME: ${NEXT_PUBLIC_COMPANY_NAME:-}
        NEXT_PUBLIC_COMPANY_USCC: ${NEXT_PUBLIC_COMPANY_USCC:-}
        NEXT_PUBLIC_ICP_BEIAN: ${NEXT_PUBLIC_ICP_BEIAN:-}
        NEXT_PUBLIC_POLICE_BEIAN: ${NEXT_PUBLIC_POLICE_BEIAN:-}
    expose:
      - "3000"
    depends_on:
      - backend
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --- 日志聚合 (E3) -------------------------------------------------------
  # Loki + Promtail 收集所有容器的 json-file 日志。structlog 已输出 JSON,
  # Promtail 直接抓取 /var/lib/docker/containers 的日志文件。
  # 启用: 取消下方注释, 在服务器上 `docker compose -f docker-compose.prod.yml up -d loki promtail`。
  # Grafana 可加作可视化面板 (本节未含, 按需自行加 grafana 服务并指 datasource=loki)。
  #
  # loki:
  #   image: grafana/loki:3.0.0
  #   restart: unless-stopped
  #   command: -config.file=/etc/loki/local-config.yaml
  #   volumes:
  #     - loki-data:/loki
  #   expose:
  #     - "3100"
  #
  # promtail:
  #   image: grafana/promtail:3.0.0
  #   restart: unless-stopped
  #   volumes:
  #     - /var/lib/docker/containers:/var/lib/docker/containers:ro
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - ./promtail.yml:/etc/promtail/config.yml:ro
  #   command: -config.file=/etc/promtail/config.yml
  #   depends_on:
  #     - loki

volumes:
  pgdata:
  media:
  # A07：Redis 的 AOF 落在这里。命名卷是「容器重建不丢队列与撤销状态」的前提。
  redis-data:
  # loki-data:
