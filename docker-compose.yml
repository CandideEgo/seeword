services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seeword
      POSTGRES_PASSWORD: seeword_dev
      POSTGRES_DB: seeword
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.cloud
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://seeword:seeword_dev@db:5432/seeword
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COMMANDCODE_API_KEY: ${COMMANDCODE_API_KEY:-}
      TEACHING_ENABLED: ${TEACHING_ENABLED:-false}
      TEACHING_RUNS_ENABLED: ${TEACHING_RUNS_ENABLED:-false}
      TEACHING_ALLOWED_USER_IDS: ${TEACHING_ALLOWED_USER_IDS:-}
      TEACHING_DIALOGUE_ENABLED: ${TEACHING_DIALOGUE_ENABLED:-false}
      TEACHING_CONVERSATIONS_ENABLED: ${TEACHING_CONVERSATIONS_ENABLED:-false}
      MCP_READ_ENABLED: ${MCP_READ_ENABLED:-false}
      MCP_WRITE_ENABLED: ${MCP_WRITE_ENABLED:-false}
    depends_on:
      - db
      - redis

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.cloud
    command: celery -A app.tasks.celery_app worker -Q celery --loglevel=info
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://seeword:seeword_dev@db:5432/seeword
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COMMANDCODE_API_KEY: ${COMMANDCODE_API_KEY:-}
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

  teaching:
    profiles: [teaching]
    build:
      context: ./backend
      dockerfile: Dockerfile.cloud
    command: celery -A app.tasks.celery_app worker -Q teaching --concurrency=2 --loglevel=warning
    volumes:
      - ./backend:/app
    environment:
      RUN_MIGRATIONS: "0"
      DATABASE_URL: postgresql+asyncpg://seeword:seeword_dev@db:5432/seeword
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      TEACHING_ENABLED: ${TEACHING_ENABLED:-false}
      TEACHING_RUNS_ENABLED: ${TEACHING_RUNS_ENABLED:-false}
      TEACHING_ALLOWED_USER_IDS: ${TEACHING_ALLOWED_USER_IDS:-}
      TEACHING_DIALOGUE_ENABLED: ${TEACHING_DIALOGUE_ENABLED:-false}
      TEACHING_CONVERSATIONS_ENABLED: ${TEACHING_CONVERSATIONS_ENABLED:-false}
      LLM_GATEWAY_BASE_URL: ${LLM_GATEWAY_BASE_URL:-}
      LLM_GATEWAY_API_KEY: ${LLM_GATEWAY_API_KEY:-}
      LLM_GATEWAY_ADMIN_KEY: ${LLM_GATEWAY_ADMIN_KEY:-}
      LLM_GATEWAY_V2_TEAM_ID: ${LLM_GATEWAY_V2_TEAM_ID:-}
      LLM_GATEWAY_GOVERNANCE_VERIFIED: ${LLM_GATEWAY_GOVERNANCE_VERIFIED:-false}
    depends_on:
      - db
      - redis

volumes:
  pgdata:
